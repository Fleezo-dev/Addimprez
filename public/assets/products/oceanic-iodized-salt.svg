<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Pristine White Commercial Studio Lighting -->
    <radialGradient id="studioWhiteBg2" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </radialGradient>

    <!-- Clean White Seamless Studio Floor -->
    <linearGradient id="studioFloor2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <filter id="floorShadowBlur2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20" />
    </filter>

    <filter id="softContactShadow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" />
      <feOffset dx="0" dy="18" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.18" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Crisp White/Cyan Standup Salt Pouch -->
    <linearGradient id="whitePouch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0" />
      <stop offset="15%" stop-color="#f1f5f9" />
      <stop offset="45%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#ffffff" />
      <stop offset="75%" stop-color="#f8fafc" />
      <stop offset="90%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- CLEAN WHITE COMMERCIAL STUDIO BACKGROUND -->
  <rect width="800" height="740" fill="url(#studioWhiteBg2)" />
  <rect y="740" width="800" height="260" fill="url(#studioFloor2)" />
  <line x1="0" y1="740" x2="800" y2="740" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" />

  <!-- Soft Studio Floor Shadow -->
  <ellipse cx="400" cy="770" rx="220" ry="24" fill="#0f172a" opacity="0.15" filter="url(#floorShadowBlur2)" />
  <ellipse cx="400" cy="764" rx="170" ry="12" fill="#0f172a" opacity="0.2" filter="url(#floorShadowBlur2)" />

  <!-- STAND-UP POUCH PACKAGING -->
  <g filter="url(#softContactShadow2)">
    <!-- Main Pouch Shape -->
    <path d="M 230 180 Q 220 450 205 720 Q 202 755 240 760 Q 400 775 560 760 Q 598 755 595 720 Q 580 450 570 180 Z" fill="url(#whitePouch)" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Top Heat Seal Header -->
    <rect x="228" y="145" width="344" height="42" rx="4" fill="#02416b" />
    <line x1="235" y1="156" x2="565" y2="156" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
    <line x1="235" y1="166" x2="565" y2="166" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
    <text x="400" y="172" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" letter-spacing="3" text-anchor="middle">
      EASY-TEAR AIRTIGHT PACKAGING
    </text>

    <!-- POUCH FRONT DESIGN -->
    <!-- Top Teal Ribbon -->
    <path d="M 226 210 Q 400 230 574 210 L 576 250 Q 400 270 224 250 Z" fill="#0284c7" />
    <text x="400" y="242" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="3" fill="#ffffff" text-anchor="middle">
      FORTIFIED WITH ESSENTIAL IODINE
    </text>

    <!-- Brand Name: OCEANIC -->
    <text x="400" y="325" font-family="'Montserrat', 'Arial Black', sans-serif" font-size="54" font-weight="900" letter-spacing="6" fill="#03456e" text-anchor="middle">
      OCEANIC
    </text>

    <!-- Wave motif under title -->
    <path d="M 310 345 Q 355 330 400 345 T 490 345" fill="none" stroke="#0284c7" stroke-width="4" stroke-linecap="round" />
    
    <text x="400" y="380" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="800" letter-spacing="3" fill="#0369a1" text-anchor="middle">
      PURE IODIZED SEA SALT
    </text>
    <text x="400" y="405" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2" fill="#64748b" text-anchor="middle">
      FREE FLOWING • CRUSHED FINE GRAIN
    </text>

    <!-- Ocean Wave Graphic Base on Pack -->
    <path d="M 215 520 Q 300 480 390 530 T 585 500 L 592 730 Q 560 760 400 770 Q 240 760 208 730 Z" fill="#075985" />
    <path d="M 210 560 Q 310 520 400 560 T 590 540 L 592 730 Q 560 760 400 770 Q 240 760 208 730 Z" fill="#0284c7" />
    <path d="M 208 610 Q 300 580 400 615 T 592 590 L 592 730 Q 560 760 400 770 Q 240 760 208 730 Z" fill="#38bdf8" />

    <!-- Salt Shaker Silhouette / Illustration on Pack -->
    <circle cx="400" cy="470" r="42" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
    <path d="M 388 450 L 412 450 L 416 490 L 384 490 Z" fill="#0284c7" />
    <rect x="386" y="445" width="28" height="6" rx="2" fill="#0369a1" />
    <circle cx="395" cy="448" r="1" fill="#ffffff" />
    <circle cx="400" cy="448" r="1" fill="#ffffff" />
    <circle cx="405" cy="448" r="1" fill="#ffffff" />

    <!-- Circular Badges on Ocean Waves -->
    <g transform="translate(250, 630)">
      <circle cx="40" cy="30" r="22" fill="#ffffff" stroke="#0369a1" stroke-width="2" />
      <text x="40" y="27" font-family="sans-serif" font-size="8" font-weight="900" fill="#0369a1" text-anchor="middle">100%</text>
      <text x="40" y="38" font-family="sans-serif" font-size="7" font-weight="700" fill="#0284c7" text-anchor="middle">PURITY</text>

      <circle cx="150" cy="30" r="24" fill="#fe4101" />
      <text x="150" y="26" font-family="sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">1 KG</text>
      <text x="150" y="38" font-family="sans-serif" font-size="8" font-weight="700" fill="#ffffff" text-anchor="middle">NET WT.</text>

      <circle cx="260" cy="30" r="22" fill="#ffffff" stroke="#0369a1" stroke-width="2" />
      <text x="260" y="27" font-family="sans-serif" font-size="8" font-weight="900" fill="#0369a1" text-anchor="middle">EXTRA</text>
      <text x="260" y="38" font-family="sans-serif" font-size="7" font-weight="700" fill="#0284c7" text-anchor="middle">IODINE</text>
    </g>

    <!-- Bottom Strip -->
    <rect x="235" y="700" width="330" height="28" rx="4" fill="#0c4a6e" />
    <text x="400" y="718" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="2" fill="#bae6fd" text-anchor="middle">
      DAILY VITALITY &amp; NUTRITIONAL BALANCE
    </text>
  </g>

  <!-- Studio Floating Badge Top Left -->
  <g transform="translate(48, 48)">
    <rect width="210" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#fe4101" />
    <text x="114" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      QUINS CRAFTO STUDIO
    </text>
  </g>
</svg>
