<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Background Gradient (Minimalist Studio Paper Texture) -->
    <radialGradient id="bgGlow2" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#1f2429" />
      <stop offset="60%" stop-color="#121518" />
      <stop offset="100%" stop-color="#090a0c" />
    </radialGradient>
    <linearGradient id="floorGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1114" />
      <stop offset="100%" stop-color="#050607" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0f3f6" />
    </linearGradient>

    <linearGradient id="darkCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15261d" />
      <stop offset="100%" stop-color="#09140e" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71" />
      <stop offset="100%" stop-color="#1b7a42" />
    </linearGradient>
  </defs>

  <!-- Environment -->
  <rect width="800" height="740" fill="url(#bgGlow2)" />
  <rect y="740" width="800" height="260" fill="url(#floorGrad2)" />
  <line x1="0" y1="740" x2="800" y2="740" stroke="#1d2228" stroke-width="2" opacity="0.6" />

  <!-- Drop Shadows for Stationery Mockup -->
  <ellipse cx="320" cy="590" rx="170" ry="20" fill="#000000" opacity="0.75" />
  <ellipse cx="500" cy="690" rx="160" ry="18" fill="#000000" opacity="0.8" />

  <!-- BRAND IDENTITY MOCKUP -->
  <!-- Card 1: Main Dark Corporate Folder / Brand Book (Left Tilted) -->
  <g transform="rotate(-6 320 480)">
    <rect x="140" y="240" width="360" height="480" rx="12" fill="url(#darkCardBg)" stroke="#1f4430" stroke-width="2" />
    <!-- Gold/Green Botanical Icon on Cover -->
    <g transform="translate(320, 420)">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#2ecc71" stroke-width="3" stroke-dasharray="2 3" />
      <!-- Stylized 'N' with botanical leaf -->
      <path d="M -16 20 L -16 -20 L 16 20 L 16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 0 -22 C 12 -34, 26 -28, 22 -14 C 18 -6, 6 -12, 0 -22 Z" fill="url(#leafGrad)" />
    </g>

    <text x="320" y="520" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">
      NETTA
    </text>
    <text x="320" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#2ecc71" text-anchor="middle">
      BOTANICALS
    </text>
    <text x="320" y="575" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#88b59b" text-anchor="middle">
      ORGANIC ESSENTIALS &amp; CARE
    </text>
  </g>

  <!-- Card 2: Light Business Card Overlapping Right -->
  <g transform="rotate(8 520 560)">
    <rect x="360" y="440" width="310" height="190" rx="10" fill="url(#cardBg)" stroke="#d5dbe2" stroke-width="2" />
    <g transform="translate(420, 510)">
      <path d="M -10 14 L -10 -14 L 10 14 L 10 -14" fill="none" stroke="#0e2a1b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 0 -15 C 8 -22, 17 -18, 14 -9 C 11 -4, 4 -8, 0 -15 Z" fill="#2ecc71" />
    </g>
    <text x="470" y="508" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#0e2a1b">
      NETTA
    </text>
    <text x="470" y="524" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#2ecc71">
      ORGANIC CARE
    </text>

    <!-- Card details line -->
    <line x1="390" y1="550" x2="630" y2="550" stroke="#e0e6ed" stroke-width="1.5" />
    <text x="390" y="574" font-family="sans-serif" font-size="9" font-weight="600" fill="#607180">
      hello@nettabotanicals.com
    </text>
    <text x="390" y="592" font-family="sans-serif" font-size="9" font-weight="600" fill="#607180">
      +91 95666 64663 • Coimbatore
    </text>
    <circle cx="630" cy="585" r="14" fill="#fe4101" />
    <text x="630" y="589" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">QC</text>
  </g>

  <!-- Studio Floating Tag Top Left -->
  <g transform="translate(60, 60)">
    <rect width="180" height="34" rx="6" fill="#1e222d" stroke="#fe4101" stroke-width="1.5" />
    <text x="90" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">
      QUINS CRAFTO BRANDING
    </text>
  </g>
</svg>
