<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <!-- Pristine White Commercial Studio Lighting -->
    <radialGradient id="studioWhiteBg2" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </radialGradient>

    <!-- Clean White Seamless Studio Floor -->
    <linearGradient id="studioFloor2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <linearGradient id="darkCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d" />
      <stop offset="100%" stop-color="#052e16" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <filter id="shadowDesk1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" />
      <feOffset dx="4" dy="16" />
      <feComponentTransfer><feFuncA type="linear" slope="0.16" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <filter id="shadowDesk2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" />
      <feOffset dx="6" dy="14" />
      <feComponentTransfer><feFuncA type="linear" slope="0.18" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <!-- CLEAN WHITE COMMERCIAL STUDIO BACKGROUND -->
  <rect width="800" height="740" fill="url(#studioWhiteBg2)" />
  <rect y="740" width="800" height="260" fill="url(#studioFloor2)" />
  <line x1="0" y1="740" x2="800" y2="740" stroke="#cbd5e1" stroke-width="1.2" opacity="0.6" />

  <!-- BRAND IDENTITY MOCKUP -->
  <!-- Card 1: Main Dark Emerald Corporate Brand Book (Left Tilted) -->
  <g transform="rotate(-6 320 480)" filter="url(#shadowDesk1)">
    <rect x="140" y="240" width="360" height="480" rx="12" fill="url(#darkCardBg)" stroke="#166534" stroke-width="2" />
    <!-- Gold/Green Botanical Icon on Cover -->
    <g transform="translate(320, 420)">
      <circle cx="0" cy="0" r="48" fill="none" stroke="#4ade80" stroke-width="3" stroke-dasharray="2 3" />
      <path d="M -16 20 L -16 -20 L 16 20 L 16 -20" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 0 -22 C 12 -34, 26 -28, 22 -14 C 18 -6, 6 -12, 0 -22 Z" fill="url(#leafGrad)" />
    </g>

    <text x="320" y="520" font-family="'Montserrat', sans-serif" font-size="28" font-weight="900" letter-spacing="6" fill="#ffffff" text-anchor="middle">
      NETTA
    </text>
    <text x="320" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="5" fill="#4ade80" text-anchor="middle">
      BOTANICALS
    </text>
    <text x="320" y="575" font-family="sans-serif" font-size="9" font-weight="600" letter-spacing="3" fill="#86efac" text-anchor="middle">
      ORGANIC ESSENTIALS &amp; CARE
    </text>
  </g>

  <!-- Card 2: Light Business Card Overlapping Right -->
  <g transform="rotate(8 520 560)" filter="url(#shadowDesk2)">
    <rect x="360" y="440" width="310" height="190" rx="10" fill="url(#cardBg)" stroke="#cbd5e1" stroke-width="1.5" />
    <g transform="translate(420, 510)">
      <path d="M -10 14 L -10 -14 L 10 14 L 10 -14" fill="none" stroke="#052e16" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 0 -15 C 8 -22, 17 -18, 14 -9 C 11 -4, 4 -8, 0 -15 Z" fill="#16a34a" />
    </g>
    <text x="470" y="508" font-family="'Montserrat', sans-serif" font-size="20" font-weight="900" letter-spacing="4" fill="#052e16">
      NETTA
    </text>
    <text x="470" y="524" font-family="sans-serif" font-size="9" font-weight="700" letter-spacing="2" fill="#16a34a">
      ORGANIC CARE
    </text>

    <!-- Card details line -->
    <line x1="390" y1="550" x2="630" y2="550" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="390" y="574" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">
      hello@nettabotanicals.com
    </text>
    <text x="390" y="592" font-family="sans-serif" font-size="9" font-weight="600" fill="#475569">
      +91 95666 64663 • Coimbatore
    </text>
    <circle cx="630" cy="585" r="14" fill="#fe4101" />
    <text x="630" y="589" font-family="sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">QC</text>
  </g>

  <!-- Studio Floating Badge Top Left -->
  <g transform="translate(48, 48)">
    <rect width="210" height="34" rx="17" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" />
    <circle cx="18" cy="17" r="6" fill="#fe4101" />
    <text x="114" y="22" font-family="sans-serif" font-size="11" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">
      QUINS CRAFTO BRANDING
    </text>
  </g>
</svg>
